<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رتّب شقتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#bfe3ff;--card:#fff8e6;--ink:#2b2218;--muted:#6b5f4c;--accent:#e0574a;--teal:#2fa36b;--sun:#f2b632;--wall:#f6d3c9;--base:#fff6e0;--edge:#2a1c12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.6),transparent 60%),var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;min-height:100vh;-webkit-user-select:none;user-select:none}
.app{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:2.2rem;font-weight:900;margin:.2em 0;line-height:1.2;text-shadow:3px 3px 0 rgba(0,0,0,.35)}.hero h1::after{content:"";display:block;height:4px;margin:8px auto 0;width:140px;background:linear-gradient(90deg,transparent,var(--sun),transparent)}
p{margin:.3em 0;line-height:1.6}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.big{display:block;width:100%;text-align:right;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.08)),var(--card);border-radius:6px;padding:16px 18px;margin:12px 0;border:2px solid var(--edge);border-inline-start-width:10px;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.big b{display:block;font-size:1.3rem}.big span{color:var(--muted);font-size:.95rem}
.big .bs{display:block;font-style:normal;font-size:.9rem;margin-top:6px;letter-spacing:1px}.big .bs:empty{display:none}
.big.a{border-inline-start-color:var(--teal)}.big.b{border-inline-start-color:var(--accent)}
.hero{text-align:center;padding:18px 0 4px}
.bar{height:14px;background:var(--card);border-radius:2px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:var(--teal);transition:width .1s linear}
.say{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.say .bot{font-size:2.4rem}
.say p{background:var(--card);border-radius:4px;border:2px solid var(--edge);border-inline-start:6px solid var(--sun);box-shadow:0 3px 0 rgba(0,0,0,.4);padding:8px 14px;font-weight:700;flex:1;min-height:1.6em}
#room{position:relative;touch-action:none;overflow:hidden}
.star{position:absolute;font-size:1.8rem;pointer-events:none;animation:up .9s forwards;z-index:12}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.ov{position:fixed;inset:0;background:rgba(8,5,3,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.box{background:var(--card);border:3px solid var(--edge);box-shadow:0 8px 0 rgba(0,0,0,.5);border-radius:8px;padding:24px;max-width:380px;width:100%;text-align:center}
.stars{font-size:2.6rem;letter-spacing:4px}
.tip{background:var(--bg);border-radius:4px;border-inline-start:5px solid var(--sun);padding:10px;font-size:.95rem;margin:12px 0}
.btn{background:var(--accent);color:#f6ead0;border:2px solid var(--edge);border-radius:4px;padding:10px 22px;font-weight:900;font-size:1.1rem;margin:4px;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.btn.alt{background:var(--teal)}
.back{background:var(--card);border-radius:6px;padding:4px 12px;font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#game:not([hidden]){position:fixed;inset:0;z-index:5;background:var(--bg)}
#game #room{position:absolute;inset:0;height:auto}
#game .top{display:contents}
#game .back,#game .bar,#game .say,#game .pb{position:absolute;z-index:20}
#game .back{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:52px;height:52px;padding:0;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#game .back svg{width:26px;height:26px}
#game .bar{top:env(safe-area-inset-top,0px);left:0;right:0;margin:0;border-radius:0;height:8px}
#game .say{top:calc(env(safe-area-inset-top,0px) + 58px);left:12px;right:12px;margin:0;pointer-events:none;justify-content:flex-start}
#game .say p{flex:0 1 auto}
#game .pb{top:calc(env(safe-area-inset-top,0px) + 14px);width:calc(50% - 20px);max-width:280px;height:32px;border-radius:99px;background:var(--card);overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.18)}
#game .pb i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:var(--teal);opacity:.55;transition:width .35s}
#game #left i{background:var(--accent)}
#game .pb span{position:relative;display:block;text-align:center;line-height:32px;font-weight:900;font-size:.95rem}
#game #lv{right:12px}#game #left{left:12px}
.nv{position:absolute;z-index:20;width:48px;height:48px;border-radius:50%;background:var(--card);font-size:1.2rem;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.2);opacity:.9}
#mt{right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
#nl{left:10px;top:42%}#nr{right:10px;top:42%}
#dp{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:auto;padding:0 20px;border-radius:99px;font-size:1rem}
#joy{position:absolute;z-index:20;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);width:130px;height:130px;border-radius:50%;background:var(--card);opacity:.6;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--teal);box-shadow:0 3px 0 rgba(0,0,0,.2);pointer-events:none}
#tp{position:absolute;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);background:var(--card);padding:6px 14px;border-radius:99px;font-weight:700;pointer-events:none;width:max-content;max-width:calc(100% - 24px);text-align:center;box-sizing:border-box;animation:tpf 7s forwards}
@keyframes tpf{0%,75%{opacity:1}100%{opacity:0}}
.say{transition:opacity .25s,transform .25s}.say.sh2{animation:sayin .3s}@keyframes sayin{from{opacity:0;transform:translateY(-8px)}}
.nv,#game .back,#game .pb,#joy{border:2px solid var(--edge)}
#game .pb{border-radius:4px}
#game .pb i{opacity:.85}
#tp{border:2px solid var(--edge);border-radius:4px}
#game::after{content:"";position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 68%,rgba(40,25,10,.2) 100%)}
#fade{position:fixed;inset:0;z-index:40;background:#050302;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}
#fade small{display:block;color:var(--sun);letter-spacing:2px;font-weight:700}
#fade b{display:block;font-size:2.6rem;font-weight:900;color:#ecdfc4;text-shadow:3px 3px 0 #000;margin:6px 0 16px}
#plan{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:520px;padding:0 14px}
#plan i{font-style:normal;font-size:.8rem;padding:4px 8px;border:2px solid #5b4a37;color:#8f7f68;border-radius:3px}
#plan i.d{background:var(--teal);border-color:var(--teal);color:#f3ead4}
#plan i.c{border-color:var(--sun);color:var(--sun)}
</style>
</head>
<body>
<div class="app">
  <section id="home">
    <div class="hero"><h1>رتّب شقتك</h1></div>
    <button class="big a" id="m1"><b>🏠 الشقة الفوضوية</b><span>بدون وقت، رتّب غرف الشقة واحدة بعد الأخرى وتعلّم أماكن الأشياء</span><em class="bs" id="bs1"></em></button>
    <button class="big b" id="m2"><b>⏱️ ضد الساعة</b><span>رتّب كل غرفة قبل أن ينتهي وقتها</span><em class="bs" id="bs2"></em></button>
  </section>

  <section id="game" hidden>
    <div class="top"><button class="back" id="back" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button><div class="pb" id="lv"><i></i><span></span></div><div class="pb" id="left"><i></i><span></span></div></div>
    <div class="bar" id="bar" hidden><i></i></div>
    <div class="say" id="say" hidden aria-live="polite"><span class="bot">🧒</span><p id="sayt"></p></div>
    <button class="nv" id="nl" aria-label="دوران لليسار">◀</button><button class="nv" id="nr" aria-label="دوران لليمين">▶</button><button class="nv" id="dp" hidden>✋ اترك الغرض</button><button class="nv" id="mt" aria-label="كتم الصوت">🔊</button>
    <div id="tp">تحرّك بالعصا لتقود الشخصية، واسحب الشاشة لتدوير الكاميرا. اضغط غرضًا عليه حلقة ذهبية لتحمله الشخصية، ثم اضغط مكانه الصحيح. وعند الانتهاء اخرج من الباب.</div>
    <div id="room"></div>
    <div id="joy" aria-label="عصا الحركة"><i></i></div>
  </section>

  <div class="ov" id="res" hidden><div class="box">
    <div class="stars" id="rs"></div><h1 id="rt" style="font-size:1.7rem"></h1><p id="rm"></p>
    <div class="tip" id="tip"></div>
    <button class="btn" id="b1"></button><button class="btn alt" id="b2">القائمة</button>
  </div></div>
</div>

<div id="fade"><div><small id="ftS"></small><b id="ftT"></b><div id="plan"></div></div></div>
<script type="module">
const $=id=>document.getElementById(id);
let THREE;
try{THREE=await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js")}
catch(err){$("home").insertAdjacentHTML("beforeend","<p>تعذّر تحميل المحرّك ثلاثي الأبعاد. تأكد من الاتصال بالإنترنت ثم أعد تحميل الصفحة.</p>");throw err}
try{document.fonts&&document.fonts.load("700 28px Cairo")}catch(e){}

/* ============ بيانات اللعبة ============ */
const kCush="\u{1F6CB}",kRemote="\u{1F4FA}",kMag="\u{1F4F0}",kPillow="\u{1F6CC}",kBlank="\u{1F9E3}",kBrush="\u{1FAA5}",kSoap="\u{1F9FC}",kShamp="\u{1F9F4}",kRoll="\u{1F9FB}",kApple="\u{1F34E}",kCheese="\u{1F9C0}",kCarrot="\u{1F955}",kEgg="\u{1F95A}";
const Z={
 closet:{n:"الخزانة",items:["👕","👖","🧦","🧢","🧥","👗"]},
 shelf:{n:"الرف",items:["📖","✏️","🎒","📒","🖍️","📐"]},
 toys:{n:"صندوق الألعاب",items:["🧸","🚗","🧩","⚽","🪁","🎲"]},
 trash:{n:"سلة المهملات",items:["🍌","🧃","🥤","📄"]},
 kitchen:{n:"المطبخ",items:["🥛","🥣","🍴","☕"]},
 sofa:{n:"الأريكة",items:[kCush,kRemote,kMag]},
 bed:{n:"السرير",items:[]},
 cabinet:{n:"خزانة الحمام",items:[kBrush,kSoap,kShamp,kRoll]},
 laundry:{n:"سلة الغسيل",items:[]},
 fridge:{n:"الثلاجة",items:[kApple,kCheese,kCarrot,kEgg]}
};
Z.bed.items=[kPillow,kBlank,Z.toys.items[0]];
Z.laundry.items=[0,1,2,5].map(i=>Z.closet.items[i]);
/* الشقة: خمس غرف بالترتيب، وكل غرفة لها باب تخرج منه إلى التي بعدها */
const L=[
 {id:"kids",name:"غرفتك",z:["closet","shelf","toys"],n:6,t:40,wall:0xffc2b3,floor:"wood",rug:1},
 {id:"living",name:"غرفة المعيشة",z:["sofa","shelf","toys","trash"],n:8,t:50,wall:0xffe08a,floor:"wood",rug:1},
 {id:"bed",name:"غرفة النوم",z:["bed","closet","shelf","trash"],n:9,t:55,wall:0xcdb4f5,floor:"wood",rug:1},
 {id:"bath",name:"الحمام",z:["cabinet","laundry","trash"],n:9,t:55,wall:0x9fe3de,floor:"tile",rug:0},
 {id:"kitchen",name:"المطبخ",z:["fridge","kitchen","trash"],n:10,t:70,wall:0xffc977,floor:"tile",rug:0}
];
const NM={"👕":"القميص","👖":"البنطال","🧦":"الجورب","🧢":"القبعة","🧥":"المعطف","👗":"الفستان","📖":"الكتاب","✏️":"القلم","🎒":"الحقيبة","📒":"الدفتر","🖍️":"ألوان الشمع","📐":"المسطرة","🧸":"الدمية","🚗":"السيارة","🧩":"قطع التركيب","⚽":"الكرة","🪁":"الطائرة الورقية","🎲":"النرد","🍌":"قشر الموز","🧃":"علبة العصير الفارغة","🥤":"الكوب الفارغ","📄":"الورقة الممزقة","🥛":"كوب الحليب","🥣":"الوعاء","🍴":"الملاعق","☕":"الفنجان"};
Object.assign(NM,{[kCush]:"الوسادة الصغيرة",[kRemote]:"جهاز التحكم",[kMag]:"المجلة",[kPillow]:"المخدّة",[kBlank]:"البطانية",[kBrush]:"فرشاة الأسنان",[kSoap]:"الصابونة",[kShamp]:"زجاجة الشامبو",[kRoll]:"لفة المناديل",[kApple]:"التفاحة",[kCheese]:"قطعة الجبن",[kCarrot]:"الجزرة",[kEgg]:"البيض"});
const WHY={closet:"الملابس تُحفظ في الخزانة لتبقى نظيفة ومرتبة.",shelf:"أدوات الدراسة مكانها الرف لتجدها وقت الواجب.",toys:"الألعاب مكانها صندوق الألعاب كي لا يتعثر بها أحد.",trash:"المهملات مكانها السلة حتى تبقى الغرفة نظيفة.",kitchen:"أدوات الأكل والشرب مكانها المطبخ."};
Object.assign(WHY,{sofa:"الوسائد والمجلات وجهاز التحكم مكانها الأريكة.",bed:"الوسادة والبطانية والدمية مكانها السرير لتنام مرتاحًا.",cabinet:"أدوات النظافة مكانها خزانة الحمام.",laundry:"الملابس المتسخة مكانها سلة الغسيل.",fridge:"الطعام الطازج مكانه الثلاجة ليبقى صالحًا."});
const TIPS=["الترتيب يساعدك تلاقي أغراضك بسرعة.","كل غرض له بيت، وبيته يحميه من الضياع.","الغرفة المرتبة تعطيك مساحة أكبر للّعب."];
const PRAISE=["أحسنت! 🌟","ممتاز!","رائع جدًا!","بطل الترتيب! 💪","هكذا تمامًا!"];
const C6=[0xff5d73,0x35a7ff,0xffc93c,0x1fb5a5,0x9b5de5,0xff9f43];
const Y={closet:0,kitchen:0,shelf:Math.PI/2,toys:-Math.PI/2,trash:Math.PI};

/* ============ المشهد والمحرك ============ */
const R=3.2,WH=3;
const room=$("room");
let renderer;
try{
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
}catch(err){$("home").insertAdjacentHTML("beforeend","<p>جهازك أو متصفحك لا يدعم الرسوم ثلاثية الأبعاد (WebGL).</p>");throw err}
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
const cv=renderer.domElement;cv.style.cssText="position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none";
cv.addEventListener("contextmenu",e=>e.preventDefault());
room.appendChild(cv);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(70,1,.05,40);cam.rotation.order="YXZ";cam.position.set(0,1.45,0);
function fit(){const w=room.clientWidth,h=room.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);const a=w/h;cam.aspect=a;
 cam.fov=Math.max(65,Math.min(95,2*Math.atan(Math.tan(40*Math.PI/180)/a)*180/Math.PI));cam.updateProjectionMatrix()}
addEventListener("resize",fit);addEventListener("orientationchange",()=>setTimeout(fit,200));

const hemi=new THREE.HemisphereLight(0xffffff,0xe6dccb,1.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1cf,2.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
{const c=sun.shadow.camera;c.left=c.bottom=-6;c.right=c.top=6;c.near=1;c.far=24}
sun.shadow.bias=-.0004;sun.shadow.normalBias=.03;
sun.position.set(R+5,5,1.2);sun.target.position.set(0,0,0);scene.add(sun,sun.target);
const lamp=new THREE.PointLight(0xfff0d8,10,0,2);lamp.position.set(0,2.7,0);scene.add(lamp);

/* مساعدات البناء */
/* تظليل كرتوني بدرجات حادة وألوان نقية زاهية */
const GRAD=(()=>{const d=new Uint8Array([70,130,200,255]),t=new THREE.DataTexture(d,4,1,THREE.RedFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t})();
const TN=o=>new THREE.MeshToonMaterial(Object.assign({gradientMap:GRAD},o));
const dull=c=>{const k=new THREE.Color(c),h={};k.getHSL(h);return k.setHSL(h.h,h.s>.12?Math.min(1,h.s*1.3+.05):h.s,Math.min(.92,h.l))};
const M=(c,r=.65,m=0)=>TN({color:dull(c)});
const sh=o=>{o.castShadow=true;o.receiveShadow=true;return o};
const bx=(w,h,d,m,x=0,y=0,z=0)=>{const o=sh(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m));o.position.set(x,y,z);return o};
const cy=(rt,rb,h,m,x=0,y=0,z=0,s=20)=>{const o=sh(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),m));o.position.set(x,y,z);return o};
const sp=(r,m,x=0,y=0,z=0)=>{const o=sh(new THREE.Mesh(new THREE.SphereGeometry(r,20,14),m));o.position.set(x,y,z);return o};
const tor=(r,t,arc,m,x=0,y=0,z=0)=>{const o=sh(new THREE.Mesh(new THREE.TorusGeometry(r,t,8,20,arc),m));o.position.set(x,y,z);return o};
const ico=(r,m)=>{m.flatShading=true;return sh(new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),m))};
const R3=(o,x,y,z)=>{o.rotation.set(x,y,z);return o};
const Gp=(...a)=>{const g=new THREE.Group();g.add(...a);return g};
const hidMat=()=>new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false});
const W0=()=>M(0xfffaf0,.8);
const GOLD=()=>M(0xf1c75b,.35,.6);
const MET=()=>M(0xcfd6e4,.3,.8);
const BLK=()=>M(0x222633,.7);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const isDark=()=>false;
const shared=new Set();

/* خامات مولّدة */
function woodTex(){const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d"),pw=64;
 for(let i=0;i<8;i++){const x=i*pw;g.fillStyle=`hsl(${28+Math.random()*8},${68+Math.random()*8}%,${60+Math.random()*7}%)`;g.fillRect(x,0,pw,512);
  for(let k=0;k<30;k++){g.strokeStyle=`rgba(120,70,20,${.03+Math.random()*.04})`;g.lineWidth=1;g.beginPath();const gx=x+Math.random()*pw;g.moveTo(gx,0);g.bezierCurveTo(gx+6,170,gx-6,340,gx+3,512);g.stroke()}
  g.fillStyle="rgba(110,60,20,.3)";g.fillRect(x,(i*173)%512,pw,3);g.fillRect(x,0,3,512)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(5,5);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
/* جدار حجري قديم: كتل، فواصل داكنة، وخربشات تظليل بالحبر */
function wallTex(){const c=document.createElement("canvas");c.width=c.height=512;const g=c.getContext("2d");
 g.fillStyle="#f4f4f4";g.fillRect(0,0,512,512);
 const bh=64,bw=128;
 for(let r=0;r<8;r++){for(let q=-1;q<5;q++){const x=q*bw+(r%2?bw/2:0),y=r*bh,v=246+Math.floor(Math.random()*9);

function pushOut(p,r){const lim=R-.35,ok=(x,z)=>x>=-lim&&x<=lim&&z>=-lim&&z<=lim;

 /* عدة مرات: الخروج من قطعة أثاث قد يُدخل النقطة في قطعة مجاورة */
 for(let pass=0;pass<4;pass++){let moved=false;
  for(const b of OBS){const x0=b.min.x-r,x1=b.max.x+r,z0=b.min.z-r,z1=b.max.z+r;
   if(p.x>x0&&p.x<x1&&p.z>z0&&p.z<z1){
    /* أقرب مخرج يبقى داخل الغرفة، فلا تُدفع النقطة خلف الجدار أبدًا */
    const c=[[p.x-x0,x0,p.z],[x1-p.x,x1,p.z],[p.z-z0,p.x,z0],[z1-p.z,p.x,z1]].filter(o=>ok(o[1],o[2])).sort((a,b)=>a[0]-b[0]);
    if(c.length){p.x=c[0][1];p.z=c[0][2];moved=true}}}
  if(!moved)break}
 /* فجوة ضيقة بين قطعتين: نختار أقرب نقطة خالية فعلًا بدل التأرجح بينهما */
 const hit=(x,z)=>OBS.some(b=>x>b.min.x-r&&x<b.max.x+r&&z>b.min.z-r&&z<b.max.z+r);

  for(const b of OBS)for(const [x,z] of [[b.min.x-r,p.z],[b.max.x+r,p.z],[p.x,b.min.z-r],[p.x,b.max.z+r]]){

 if(!$("game").hidden){

  for(let i=tw.length-1;i>=0;i--){const a=tw[i];a.t+=dt;const u=Math.min(1,a.t/a.dur);a.fn(u);if(u>=1){tw.splice(i,1);a.done&&a.done()}}

  if(ml>.01&&!over&&!busy){const f=2*dt,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw),wx=fx*my+rx*mx,wz=fz*my+rz*mx;

  PRn+=(((carry&&!busy)?PR+.12:PR)-PRn)*Math.min(1,dt*6);pushOut(P,PRn);
  pYaw+=wrapA(pYawT-pYaw)*Math.min(1,dt*(busy?20:12));

  mv+=(clamp(spd/1.6,0,1)-mv)*Math.min(1,dt*12);walkPh+=spd*dt*5.5;
  if(cheerT>0)cheerT-=dt;
  if(!reaching)hand.position.lerp(carry?HCARRY:HIDLE,Math.min(1,dt*8));
  hand.visible=true;
  poseChar(dt,t);
  camFollow();
  if(doorLeaf){doorO+=((doorOpen?1:0)-doorO)*Math.min(1,dt*5);doorLeaf.rotation.y=doorO*1.6;if(doorMat){doorMat.emissive.setHex(0xffc93c);doorMat.emissiveIntensity=doorOpen?.22+.18*Math.sin(t*5):0}}
  for(const it of fall){const u=it.userData;u.vy-=14*dt;it.position.y+=u.vy*dt;it.rotation.x*=.9;it.rotation.z*=.9;
   if(it.position.y<=0){it.position.y=0;if(Math.abs(u.vy)>1.2)u.vy=-u.vy*.32;else{u.vy=0;fall.delete(it)}}}
  for(const k in ZN){const z=ZN[k],near=!!carry&&distTo(z.g.position.x,z.g.position.z)<=ZREACH;
   z.open+=(((near||z.n>0)?1:0)-z.open)*Math.min(1,dt*7);if(z.anim)z.anim(z.open);
   let ei=0,ec=0xffc93c;if(z.hintT>0){z.hintT-=dt;ec=0xff5d73;ei=.25+.3*Math.sin(t*16)}else if(near)ei=.18;
   if(ei!==z._ei||z.hintT>0){z.mats.forEach(m=>{m.emissive.setHex(ec);m.emissiveIntensity=ei});z._ei=ei}}
  itemsG.children.forEach(it=>{const u=it.userData;if(!u.rg)return;
   const on=!u.placed&&!carry&&it.position.y<.3&&distTo(it.position.x,it.position.z)<=REACH;u.rg.visible=on;if(on)u.rg.scale.setScalar(1+.08*Math.sin(t*6))});
  const sd=!!carry&&!busy;if(sd!==dpShown){$("dp").hidden=!sd;dpShown=sd}
  renderer.render(scene,cam);
 }
 requestAnimationFrame(frame);
}

 if($("game").hidden||!$("res").hidden)return;

 if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){K[k]=1;e.preventDefault();return}
