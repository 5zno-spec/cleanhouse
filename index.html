<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رتّب شقتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#bfe3ff;--card:#fff8e6;--ink:#2b2218;--muted:#6b5f4c;--accent:#e0574a;--teal:#2fa36b;--sun:#f2b632;--wall:#f6d3c9;--base:#fff6e0;--edge:#2a1c12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.6),transparent 60%),var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;min-height:100vh;-webkit-user-select:none;user-select:none}
.app{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:2.2rem;font-weight:900;margin:.2em 0;line-height:1.2;text-shadow:3px 3px 0 rgba(0,0,0,.35)}.hero h1::after{content:"";display:block;height:4px;margin:8px auto 0;width:140px;background:linear-gradient(90deg,transparent,var(--sun),transparent)}
p{margin:.3em 0;line-height:1.6}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.big{display:block;width:100%;text-align:right;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.08)),var(--card);border-radius:6px;padding:16px 18px;margin:12px 0;border:2px solid var(--edge);border-inline-start-width:10px;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.big b{display:block;font-size:1.3rem}.big span{color:var(--muted);font-size:.95rem}
.big .bs{display:block;font-style:normal;font-size:.9rem;margin-top:6px;letter-spacing:1px}.big .bs:empty{display:none}
.big.a{border-inline-start-color:var(--teal)}.big.b{border-inline-start-color:var(--accent)}
.hero{text-align:center;padding:18px 0 4px}
.bar{height:14px;background:var(--card);border-radius:2px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:100%;background:var(--teal);transition:width .1s linear}
.say{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.say .bot{font-size:2.4rem}
.say p{background:var(--card);border-radius:4px;border:2px solid var(--edge);border-inline-start:6px solid var(--sun);box-shadow:0 3px 0 rgba(0,0,0,.4);padding:8px 14px;font-weight:700;flex:1;min-height:1.6em}
#room{position:relative;touch-action:none;overflow:hidden}
.star{position:absolute;font-size:1.8rem;pointer-events:none;animation:up .9s forwards;z-index:12}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.ov{position:fixed;inset:0;background:rgba(8,5,3,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.box{background:var(--card);border:3px solid var(--edge);box-shadow:0 8px 0 rgba(0,0,0,.5);border-radius:8px;padding:24px;max-width:380px;width:100%;text-align:center}
.stars{font-size:2.6rem;letter-spacing:4px}
.tip{background:var(--bg);border-radius:4px;border-inline-start:5px solid var(--sun);padding:10px;font-size:.95rem;margin:12px 0}
.btn{background:var(--accent);color:#f6ead0;border:2px solid var(--edge);border-radius:4px;padding:10px 22px;font-weight:900;font-size:1.1rem;margin:4px;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.btn.alt{background:var(--teal)}
.back{background:var(--card);border-radius:6px;padding:4px 12px;font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#game:not([hidden]){position:fixed;inset:0;z-index:5;background:var(--bg)}
#game #room{position:absolute;inset:0;height:auto}
#game .top{display:contents}
#game .back,#game .bar,#game .say,#game .pb{position:absolute;z-index:20}
#game .back{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:52px;height:52px;padding:0;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.2)}
#game .back svg{width:26px;height:26px}
#game .bar{top:env(safe-area-inset-top,0px);left:0;right:0;margin:0;border-radius:0;height:8px}
#game .say{top:calc(env(safe-area-inset-top,0px) + 58px);left:12px;right:12px;margin:0;pointer-events:none;justify-content:flex-start}
#game .say p{flex:0 1 auto}
#game .pb{top:calc(env(safe-area-inset-top,0px) + 14px);width:calc(50% - 20px);max-width:280px;height:32px;border-radius:99px;background:var(--card);overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.18)}
#game .pb i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:var(--teal);opacity:.55;transition:width .35s}
#game #left i{background:var(--accent)}
#game .pb span{position:relative;display:block;text-align:center;line-height:32px;font-weight:900;font-size:.95rem}
#game #lv{right:12px}#game #left{left:12px}
.nv{position:absolute;z-index:20;width:48px;height:48px;border-radius:50%;background:var(--card);font-size:1.2rem;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.2);opacity:.9}
/* زر الصوت أعلى يسار الشاشة بجانب شريط «المتبقي» */
#mt{left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:36px;height:36px;font-size:1rem;display:grid;place-items:center;padding:0}
#game #left{left:56px;width:calc(50% - 64px);max-width:236px}
#nl{left:10px;top:42%}#nr{right:10px;top:42%}
#dp{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:auto;padding:0 20px;border-radius:99px;font-size:1rem}
#joy{position:absolute;z-index:20;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);width:130px;height:130px;border-radius:50%;background:var(--card);opacity:.6;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--teal);box-shadow:0 3px 0 rgba(0,0,0,.2);pointer-events:none}
#tp{position:absolute;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);background:var(--card);padding:6px 14px;border-radius:99px;font-weight:700;pointer-events:none;width:max-content;max-width:calc(100% - 24px);text-align:center;box-sizing:border-box;animation:tpf 7s forwards}
@keyframes tpf{0%,75%{opacity:1}100%{opacity:0}}
.say{transition:opacity .25s,transform .25s}.say.sh2{animation:sayin .3s}@keyframes sayin{from{opacity:0;transform:translateY(-8px)}}
#game::after{content:"";position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 68%,rgba(40,25,10,.2) 100%)}
#fade{position:fixed;inset:0;z-index:40;background:#050302;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}
#fade small{display:block;color:var(--sun);letter-spacing:2px;font-weight:700}
#fade b{display:block;font-size:2.6rem;font-weight:900;color:#ecdfc4;text-shadow:3px 3px 0 #000;margin:6px 0 16px}
#plan{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:520px;padding:0 14px}
#plan i{font-style:normal;font-size:.8rem;padding:4px 8px;border:2px solid #5b4a37;color:#8f7f68;border-radius:3px}
#plan i.d{background:var(--teal);border-color:var(--teal);color:#f3ead4}
#plan i.c{border-color:var(--sun);color:var(--sun)}

/* ============ تصميم زجاجي لطيف للأزرار والأشرطة ============ */
:root{--gl-bg:linear-gradient(160deg,rgba(255,255,255,.58),rgba(255,255,255,.24));--gl-line:rgba(255,255,255,.7);
 --gl-blur:blur(14px) saturate(165%);--gl-shadow:0 8px 24px rgba(30,60,95,.16),inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.18)}
.big,.nv,.back,#game .pb,#joy,#tp,.say p,.box,.bar,#plan i{background:var(--gl-bg);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);border:1px solid var(--gl-line);box-shadow:var(--gl-shadow)}
/* المتصفحات التي لا تدعم التغبيش: زجاج أكثف كي يبقى النص مقروءًا */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.big,.nv,.back,#game .pb,#joy,#tp,.say p,.box,.bar,#plan i{background:rgba(255,255,255,.86)}}
/* بطاقات القائمة */
.big{border-radius:20px;border-inline-start:5px solid var(--gl-line);transition:transform .15s,box-shadow .15s}
.big.a{border-inline-start-color:rgba(47,163,107,.85)}.big.b{border-inline-start-color:rgba(224,87,74,.85)}
.big:active{transform:scale(.98);box-shadow:0 4px 12px rgba(30,60,95,.14),inset 0 1px 0 rgba(255,255,255,.8)}
/* الأزرار الدائرية والسفلية */
.nv,#game .back{color:var(--ink);opacity:1;transition:transform .12s}
.nv:active,#game .back:active{transform:scale(.93)}
#dp:active{transform:translateX(-50%) scale(.95)}
/* شريطا الغرفة والمتبقي: مسار زجاجي وتعبئة ملوّنة شفافة لامعة */
#game .pb{border-radius:99px}
#game .pb i{border-radius:99px;opacity:1;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),rgba(47,163,107,.55)}
#game #left i{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),rgba(224,87,74,.5)}
#game .pb span{text-shadow:0 1px 0 rgba(255,255,255,.6)}
/* شريط الوقت في الأعلى */
#game .bar{border:0;border-bottom:1px solid var(--gl-line);border-radius:0}
.bar i{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0)),rgba(47,163,107,.75)}
/* عصا الحركة: قاعدة زجاجية ومقبض زجاجي ملوّن */
#joy{opacity:1;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.5),rgba(255,255,255,.18))}
#joy i{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),rgba(47,163,107,.75) 60%);border:1px solid rgba(255,255,255,.75);box-shadow:0 4px 12px rgba(20,80,50,.3)}
/* الرسائل والتلميح */
.say p{border-radius:16px;border-inline-start:4px solid rgba(242,182,50,.9)}
#tp{border-radius:99px}
/* نافذة النتيجة وأزرارها */
.ov{background:rgba(20,32,48,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.box{border-radius:24px}
.tip{background:rgba(255,255,255,.4);border-radius:14px}
.btn{color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),rgba(224,87,74,.82);box-shadow:0 6px 18px rgba(224,87,74,.3),inset 0 1px 0 rgba(255,255,255,.6);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur)}
.btn.alt{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),rgba(47,163,107,.82);box-shadow:0 6px 18px rgba(47,163,107,.3),inset 0 1px 0 rgba(255,255,255,.6)}
.btn:active{transform:scale(.96)}
/* خريطة الغرف في شاشة الانتقال */
#plan i{border-radius:99px;color:#e9e1cf;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);box-shadow:none}
#plan i.d{background:rgba(47,163,107,.7);border-color:rgba(255,255,255,.5)}
#plan i.c{background:rgba(242,182,50,.18);border-color:var(--sun)}
/* اختيار غرفة البداية */
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 4px}
.pick>span{font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{border-radius:99px;padding:7px 14px;font-weight:700;font-size:.95rem;color:var(--ink);background:var(--gl-bg);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);border:1px solid var(--gl-line);box-shadow:var(--gl-shadow);transition:transform .12s,background .15s}
.chip:active{transform:scale(.95)}
.chip.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),rgba(47,163,107,.85);box-shadow:0 6px 16px rgba(47,163,107,.3),inset 0 1px 0 rgba(255,255,255,.6)}
</style>
</head>
<body>
<div class="app">
  <section id="home">
    <div class="hero"><h1>رتّب شقتك</h1></div>
    <div class="pick"><span>ابدأ من:</span><div class="chips" id="rooms" role="radiogroup" aria-label="الغرفة التي تبدأ منها"></div></div>
    <button class="big a" id="m1"><b>🏠 الشقة الفوضوية</b><span>بدون وقت، رتّب غرف الشقة واحدة بعد الأخرى وتعلّم أماكن الأشياء</span><em class="bs" id="bs1"></em></button>
    <button class="big b" id="m2"><b>⏱️ ضد الساعة</b><span>رتّب كل غرفة قبل أن ينتهي وقتها</span><em class="bs" id="bs2"></em></button>
  </section>

  <section id="game" hidden>
    <div class="top"><button class="back" id="back" aria-label="رجوع"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button><div class="pb" id="lv"><i></i><span></span></div><div class="pb" id="left"><i></i><span></span></div></div>
    <div class="bar" id="bar" hidden><i></i></div>
    <div class="say" id="say" hidden aria-live="polite"><span class="bot">🧭</span><p id="sayt"></p></div>
    <button class="nv" id="nl" aria-label="دوران لليسار">◀</button><button class="nv" id="nr" aria-label="دوران لليمين">▶</button><button class="nv" id="dp" hidden>✋ اترك الغرض</button><button class="nv" id="mt" aria-label="كتم الصوت">🔊</button>
    <div id="tp">تحرّك بالعصا، واسحب الشاشة للنظر. اضغط غرضًا عليه حلقة ذهبية لتمسكه، ثم اذهب به واضغط مكانه. وعند الانتهاء اخرج من الباب.</div>
    <div id="room"></div>
    <div id="joy" aria-label="عصا الحركة"><i></i></div>
  </section>

  <div class="ov" id="res" hidden><div class="box">
    <div class="stars" id="rs"></div><h1 id="rt" style="font-size:1.7rem"></h1><p id="rm"></p>
    <div class="tip" id="tip"></div>
    <button class="btn" id="b1"></button><button class="btn alt" id="b2">القائمة</button>
  </div></div>
</div>

<div id="fade"><div><small id="ftS"></small><b id="ftT"></b><div id="plan"></div></div></div>
<script type="module">
const $=id=>document.getElementById(id);
let THREE;
try{THREE=await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js")}
catch(err){$("home").insertAdjacentHTML("beforeend","<p>تعذّر تحميل المحرّك ثلاثي الأبعاد. تأكد من الاتصال بالإنترنت ثم أعد تحميل الصفحة.</p>");throw err}
try{document.fonts&&document.fonts.load("700 28px Cairo")}catch(e){}

/* ============ بيانات اللعبة ============ */
const kCush="\u{1F6CB}",kRemote="\u{1F4FA}",kMag="\u{1F4F0}",kPillow="\u{1F6CC}",kBlank="\u{1F9E3}",kBrush="\u{1FAA5}",kSoap="\u{1F9FC}",kShamp="\u{1F9F4}",kRoll="\u{1F9FB}",kApple="\u{1F34E}",kCheese="\u{1F9C0}",kCarrot="\u{1F955}",kEgg="\u{1F95A}";
const Z={
 closet:{n:"الخزانة",items:["👕","👖","🧦","🧢","🧥","👗"]},
 shelf:{n:"الرف",items:["📖","✏️","🎒","📒","🖍️","📐"]},
 toys:{n:"صندوق الألعاب",items:["🧸","🚗","🧩","⚽","🪁","🎲"]},
 trash:{n:"سلة المهملات",items:["🍌","🧃","🥤","📄"]},
 kitchen:{n:"المطبخ",items:["🥛","🥣","🍴","☕"]},
 sofa:{n:"الأريكة",items:[kCush,kRemote,kMag]},
 bed:{n:"السرير",items:[]},
 cabinet:{n:"خزانة الحمام",items:[kBrush,kSoap,kShamp,kRoll]},
 laundry:{n:"سلة الغسيل",items:[]},
 fridge:{n:"الثلاجة",items:[kApple,kCheese,kCarrot,kEgg]}
};
Z.bed.items=[kPillow,kBlank,Z.toys.items[0]];
Z.laundry.items=[0,1,2,5].map(i=>Z.closet.items[i]);
/* الشقة: خمس غرف بالترتيب، وكل غرفة لها باب تخرج منه إلى التي بعدها */
const L=[
 {id:"kids",name:"غرفتك",z:["closet","shelf","toys"],n:6,t:40,wall:0xffc2b3,floor:"wood",rug:1},
 {id:"living",name:"غرفة المعيشة",z:["sofa","shelf","toys","trash"],n:8,t:50,wall:0xffe08a,floor:"wood",rug:1},
 {id:"bed",name:"غرفة النوم",z:["bed","closet","shelf","trash"],n:9,t:55,wall:0xcdb4f5,floor:"wood",rug:1},
 {id:"bath",name:"الحمام",z:["cabinet","laundry","trash"],n:9,t:55,wall:0x9fe3de,floor:"tile",rug:0},
 {id:"kitchen",name:"المطبخ",z:["fridge","kitchen","trash"],n:10,t:70,wall:0xffc977,floor:"tile",rug:0}
];
const NM={"👕":"القميص","👖":"البنطال","🧦":"الجورب","🧢":"القبعة","🧥":"المعطف","👗":"الفستان","📖":"الكتاب","✏️":"القلم","🎒":"الحقيبة","📒":"الدفتر","🖍️":"ألوان الشمع","📐":"المسطرة","🧸":"الدمية","🚗":"السيارة","🧩":"قطع التركيب","⚽":"الكرة","🪁":"الطائرة الورقية","🎲":"النرد","🍌":"قشر الموز","🧃":"علبة العصير الفارغة","🥤":"الكوب الفارغ","📄":"الورقة الممزقة","🥛":"كوب الحليب","🥣":"الوعاء","🍴":"الملاعق","☕":"الفنجان"};
Object.assign(NM,{[kCush]:"الوسادة الصغيرة",[kRemote]:"جهاز التحكم",[kMag]:"المجلة",[kPillow]:"المخدّة",[kBlank]:"البطانية",[kBrush]:"فرشاة الأسنان",[kSoap]:"الصابونة",[kShamp]:"زجاجة الشامبو",[kRoll]:"لفة المناديل",[kApple]:"التفاحة",[kCheese]:"قطعة الجبن",[kCarrot]:"الجزرة",[kEgg]:"البيض"});
const WHY={closet:"الملابس تُحفظ في الخزانة لتبقى نظيفة ومرتبة.",shelf:"أدوات الدراسة مكانها الرف لتجدها وقت الواجب.",toys:"الألعاب مكانها صندوق الألعاب كي لا يتعثر بها أحد.",trash:"المهملات مكانها السلة حتى تبقى الغرفة نظيفة.",kitchen:"أدوات الأكل والشرب مكانها المطبخ."};
Object.assign(WHY,{sofa:"الوسائد والمجلات وجهاز التحكم مكانها الأريكة.",bed:"الوسادة والبطانية والدمية مكانها السرير لتنام مرتاحًا.",cabinet:"أدوات النظافة مكانها خزانة الحمام.",laundry:"الملابس المتسخة مكانها سلة الغسيل.",fridge:"الطعام الطازج مكانه الثلاجة ليبقى صالحًا."});
const TIPS=["الترتيب يساعدك تلاقي أغراضك بسرعة.","كل غرض له بيت، وبيته يحميه من الضياع.","الغرفة المرتبة تعطيك مساحة أكبر للّعب."];
const PRAISE=["أحسنت! 🌟","ممتاز!","رائع جدًا!","بطل الترتيب! 💪","هكذا تمامًا!"];
const C6=[0xff5d73,0x35a7ff,0xffc93c,0x1fb5a5,0x9b5de5,0xff9f43];
const Y={closet:0,kitchen:0,shelf:Math.PI/2,toys:-Math.PI/2,trash:Math.PI};

/* ============ المشهد والمحرك ============ */
const R=3.2,WH=3;
const room=$("room");
let renderer;
try{
 /* "default" بدل "high-performance": لا نجبر الحاسوب المحمول على كرت الشاشة المنفصل المستهلك للبطارية */

   if(p.x>x0&&p.x<x1&&p.z>z0&&p.z<z1){

function freeAt(x,z,r){const lim=R-.35;return x>=-lim&&x<=lim&&z>=-lim&&z<=lim&&!solids().some(b=>x>b.min.x-r&&x<b.max.x+r&&z>b.min.z-r&&z<b.max.z+r)}

 if(!carry){
  itemsG.children.forEach(it=>{if(it.userData.placed)return;const dx=it.position.x-P.x,dz=it.position.z-P.z,d=Math.hypot(dx,dz);if(d<=REACH&&(dx*fx+dz*fz)/Math.max(d,.01)>.4&&d<bd){bd=d;best=it}});
  if(best)tryGrab(best);else if(doorOpen&&nearDoor())goNext();else say("لا يوجد غرض قريب أمامك");return}
 let bz=null;
 for(const k in ZN){const z=ZN[k],dx=z.g.position.x-P.x,dz=z.g.position.z-P.z,d=Math.hypot(dx,dz);if(d<=ZREACH&&(dx*fx+dz*fz)/Math.max(d,.01)>.4&&d<bd){bd=d;bz=z}}
 if(bz)tryPlace(bz);else tryDrop(null)}

/* النظر بالسحب، والنقر للإمساك والوضع */
/* الفأرة على الكمبيوتر: تحريكها (بلا ضغط) يدير النظر يمينًا ويسارًا وصعودًا ونزولًا، والنقر يمسك ويضع.
   اللمس يبقى كما هو: السحب للنظر والنقر للإمساك */
let mouseIn=false,mouseX=.5,mTap=false,wheelD=0;
const isMouse=e=>e.pointerType==="mouse";
const playing=()=>!over&&!$("game").hidden&&$("res").hidden;
cv.addEventListener("pointerdown",e=>{if(over)return;dStart={x:e.clientX,y:e.clientY};
 if(isMouse(e)){mTap=e.button===0;return}
 cv.setPointerCapture(e.pointerId);rotP={x:e.clientX,y:e.clientY}});
cv.addEventListener("pointermove",e=>{
 if(isMouse(e)){const r=cv.getBoundingClientRect();mouseIn=true;mouseX=(e.clientX-r.left)/r.width;
  if(playing()){tgtYaw-=(e.movementX||0)*.0035;pitch=clamp(pitch-(e.movementY||0)*.003,-1,.45)}return}
 if(!rotP)return;tgtYaw+=(e.clientX-rotP.x)*.006;pitch=clamp(pitch+(e.clientY-rotP.y)*.004,-1,.45);yaw=tgtYaw;rotP={x:e.clientX,y:e.clientY}});
cv.addEventListener("pointerleave",e=>{if(isMouse(e))mouseIn=false});
const upc=e=>{
 if(isMouse(e)){const t=mTap;mTap=false;if(t&&e.type==="pointerup"&&Math.hypot(e.clientX-dStart.x,e.clientY-dStart.y)<10)tapAt(e.clientX,e.clientY);return}
 if(!rotP)return;rotP=null;if(e.type==="pointerup"&&Math.hypot(e.clientX-dStart.x,e.clientY-dStart.y)<10)tapAt(e.clientX,e.clientY)};
cv.addEventListener("pointerup",upc);cv.addEventListener("pointercancel",upc);
/* بكرة الفأرة: للأعلى تقدّم وللأسفل تأخّر (كل درجة ≈ 0.4 م، تُمشى بسلاسة في حلقة الإطار مع الاصطدام بالأثاث) */
cv.addEventListener("wheel",e=>{if(!playing())return;e.preventDefault();
 const d=e.deltaMode===1?e.deltaY*40:e.deltaMode===2?e.deltaY*400:e.deltaY;
 wheelD=clamp(wheelD-Math.sign(d)*Math.min(Math.abs(d),120)/120*.4,-1.6,1.6)},{passive:false});

/* عصا الحركة */
const joy=$("joy"),knob=joy.firstElementChild;let jid=null;
const jset=e=>{const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,lim=r.width/2-24;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy);if(m>lim){dx*=lim/m;dy*=lim/m}
 knob.style.transform=`translate(${dx}px,${dy}px)`;jx=Math.abs(dx/lim)<.12?0:dx/lim;jy=Math.abs(dy/lim)<.12?0:-dy/lim};
joy.addEventListener("pointerdown",e=>{jid=e.pointerId;joy.setPointerCapture(jid);jset(e)});
joy.addEventListener("pointermove",e=>{if(e.pointerId===jid)jset(e)});
const jend=e=>{if(e.pointerId!==jid)return;jid=null;jx=jy=0;knob.style.transform=""};
joy.addEventListener("pointerup",jend);joy.addEventListener("pointercancel",jend);

function starAt(z){const v=tmpB.copy(z.g.position);v.y=1.2;v.project(cam);
 const s=document.createElement("div");s.className="star";s.textContent="⭐";
 s.style.left=((v.x*.5+.5)*room.clientWidth-14)+"px";s.style.top=((-v.y*.5+.5)*room.clientHeight-14)+"px";room.appendChild(s);setTimeout(()=>s.remove(),900)}

/* الوضع النهائي الواقعي للغرض في مكانه:
   - يُصغَّر فقط إن كان أكبر من المساحة المتاحة (fit) فلا يخترق ظهر الرف أو سقف الخانة
   - قاعدته على السطح تمامًا، أو فوق غرض وُضع قبله في المكان نفسه (تكديس) بدل أن يخترقه
   - يتوسّط الخانة مهما كان مركز شكله */
function placePose(it,z,slot){
 const zq=z.g.getWorldQuaternion(new THREE.Quaternion()),rel=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,(Math.random()-.5)*.5,0));
 const pv=it.position.clone(),qv=it.quaternion.clone(),sv=it.scale.x;
 it.position.set(0,0,0);it.quaternion.copy(rel);it.scale.setScalar(1);it.updateMatrixWorld(true);
 const b=new THREE.Box3().setFromObject(it.children[0]),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
 it.position.copy(pv);it.quaternion.copy(qv);it.scale.setScalar(sv);it.updateMatrixWorld(true);
 const f=z.fit,k=Math.min(1,f[0]/Math.max(s.x,.01),f[1]/Math.max(s.y,.01),f[2]/Math.max(s.z,.01))*.95;
 const p=slot.clone().add(new THREE.Vector3(-c.x*k,0,-c.z*k).applyQuaternion(zq));
 /* التكديس على الصناديق النهائية المحفوظة (fb) للأغراض السابقة، لا على موضعها أثناء الحركة */
 let base=slot.y;const hw=Math.max(s.x,s.z)*k/2;
 z.items.forEach(o=>{const ob=o.userData.fb;if(!ob)return;
  if(p.x+hw>ob.min.x&&p.x-hw<ob.max.x&&p.z+hw>ob.min.z&&p.z-hw<ob.max.z)base=Math.max(base,ob.max.y+.004)});
 p.y=base-b.min.y*k;
 const q=zq.clone().multiply(rel);
 /* الصندوق النهائي للغرض في مكانه، يُحفظ ليُكدَّس عليه ما بعده */
 it.position.copy(p);it.quaternion.copy(q);it.scale.setScalar(k);it.updateMatrixWorld(true);
 it.userData.fb=new THREE.Box3().setFromObject(it.children[0]);
 it.position.copy(pv);it.quaternion.copy(qv);it.scale.setScalar(sv);it.updateMatrixWorld(true);
 return{p,q,k,zq}}
/* نقطة الاقتراب: أمام الخزانة والرف والثلاجة، وفوق الصندوق والسلال والأريكة والسرير */
const approachOf=(z,pt)=>pt.clone().add(new THREE.Vector3(...z.ap).applyQuaternion(z.g.getWorldQuaternion(new THREE.Quaternion())));
/* صوت إنجاز فرح: أربع نغمات صاعدة (دو مي صول دو) ثم بريق خفيف */
function cheer(){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t0=ac.currentTime+.05;
 [523.25,659.25,783.99,1046.5].forEach((fq,i)=>{const t=t0+i*.075,o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),top=i===3;
  o.type="triangle";o.frequency.value=fq;o2.type="sine";o2.frequency.value=fq*2;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(top?.07:.05,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+(top?.55:.22));
  o.connect(g);o2.connect(g);g.connect(ac.destination);o.start(t);o2.start(t);o.stop(t+.6);o2.stop(t+.6)});
 for(let j=0;j<6;j++){const t=t0+.3+j*.045,o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=1800+Math.random()*1600;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.022,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.15)}
}catch(e){}}
function correct(it,z,soft){
 const u=it.userData;u.placed=true;fall.delete(it);
 const slot=z.slots[(z.n++)%z.slots.length].clone(),pp=placePose(it,z,slot),A=approachOf(z,pp.p);z.items.push(it);
 const p0=it.position.clone(),s0=it.scale.x,q0=it.quaternion.clone();
 /* مرحلتان: إلى نقطة الاقتراب (أمام الخانة أو فوق الصندوق)، ثم يدخل الغرض بهدوء ويستقر في مكانه */
 tween(.26,t=>{const e=t*t*(3-2*t);it.position.lerpVectors(p0,A,e);it.scale.setScalar(s0+(pp.k-s0)*e);it.quaternion.slerpQuaternions(q0,pp.q,e)},
  ()=>tween(.3,t=>{const e=1-Math.pow(1-t,3);it.position.lerpVectors(A,pp.p,e)},()=>{it.position.copy(pp.p);it.quaternion.copy(pp.q);it.scale.setScalar(pp.k)}));
 tween(.35,t=>z.g.scale.setScalar(1+.015*Math.sin(Math.PI*t)),()=>z.g.scale.setScalar(1));
 starAt(z);setTimeout(()=>sfx(z.k),420);setTimeout(cheer,480);
 left--;hud();
 if(left===0){say("");setTimeout(()=>finish(true),700)}
 else if(mode==="time"){streak++;const b=streak>=3?3:2;end=Math.min(end+b*1000,Date.now()+L[lvl].t*1000);say("+"+b+" ثوانٍ ⏱️"+(streak>=3?"  تتابع ×"+streak+" 🔥":""))}
 else say(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
}
function wrong(it,z){
 const u=it.userData;mistakes++;snd(220,.2);
 let pen="";if(mode==="time"){streak=0;end-=3000;pen="  −3 ثوانٍ ⏱️"}
 say((NM[u.e]||"هذا الغرض")+" ليس هنا. "+WHY[u.k]+pen);
 if(mode==="relax"&&ZN[u.k])setTimeout(()=>{ZN[u.k].hintT=1.4},500);
 const h0=hand.position.clone();
 tween(.4,t=>{hand.position.copy(h0);hand.position.x+=Math.sin(t*24)*.05*(1-t)},()=>retreat(HCARRY));
}

function calcStars(){if(mode==="relax")return mistakes<=1?3:mistakes<=3?2:1;const r=(end-Date.now())/1000/L[lvl].t;return r>.5?3:r>.2?2:1}
function roomDone(){
 clearInterval(timer);$("bar").hidden=true;
 const st=calcStars();rstars[lvl]=st;saveBest(mode,lvl,st);snd(990,.3);unlockDoor();
 say("✨ "+L[lvl].name+" نظيفة! "+"⭐".repeat(st)+" الباب مفتوح، اخرج إلى "+L[nextL()].name)}
function finish(win){
 if(win&&nextL()!==startL){roomDone();return}
 over=true;clearInterval(timer);$("res").hidden=false;const b1=$("b1");
 if(!win){$("rs").textContent="⏰";$("rt").textContent="انتهى الوقت!";$("rm").textContent="رتّبت "+(total-left)+" من "+total+" أغراض. حاول مرة ثانية، ستفعلها!";$("tip").textContent="نصيحة: ابدأ بالأغراض التي تعرف مكانها فورًا.";b1.textContent="أعد المحاولة";b1.onclick=()=>start(mode,lvl);return}
 const st=calcStars();rstars[lvl]=st;snd(990,.3);const rec=saveBest(mode,lvl,st);
 const tot=Math.max(1,Math.min(3,Math.round(rstars.reduce((s,v)=>s+(v||0),0)/L.length)));
 $("rs").textContent="⭐".repeat(tot)+"☆".repeat(3-tot);$("tip").textContent=TIPS[Math.floor(Math.random()*TIPS.length)];
 $("rt").textContent="🎉 شقتك نظيفة بالكامل!";$("rm").textContent="رتّبت غرفتك وغرفة المعيشة وغرفة النوم والحمام والمطبخ. أنت بطل الترتيب!"+(rec?" رقم قياسي جديد! 🏆":"");
 b1.textContent="العب من جديد";b1.onclick=()=>start(mode,startL);
}

/* ============ حلقة الرسم ============ */
let last=performance.now(),dpShown=false;
/* توفير البطارية: لا نرسم إلا عند الحاجة.
   سرعة كاملة حين يتحرك شيء، ونحو 12 إطارًا في الثانية للمؤثرات الهادئة (نبض حلقة الغرض، توهج الباب)،
   ولا رسم إطلاقًا حين يسكن المشهد أو تغطيه نافذة النتيجة أو شاشة الانتقال (المتغيرات معرّفة قرب fit) */
function frame(now){
 const dt=Math.min(.05,(now-last)/1000),t=now/1000;last=now;
 if(!$("game").hidden){
  let mx=jx,my=jy;if(K.w||K.arrowup)my+=1;if(K.s||K.arrowdown)my-=1;if(K.d)mx+=1;if(K.a)mx-=1;
  if(K.arrowleft)tgtYaw+=dt*1.8;if(K.arrowright)tgtYaw-=dt*1.8;
  /* المؤشر عند طرف الشاشة الأيسر أو الأيمن: يستمر الدوران، فيمكن الالتفاف كاملًا وإن وصل المؤشر إلى الحافة */
  if(mouseIn&&playing()){if(mouseX<.06)tgtYaw+=dt*1.6*(1-mouseX/.06);else if(mouseX>.94)tgtYaw-=dt*1.6*((mouseX-.94)/.06)}
  /* البكرة: تُضاف إلى التقدم/التأخر بسرعة المشي نفسها حتى تنتهي المسافة */
  if(wheelD&&!over){const w=clamp(wheelD/(2*dt),-1,1);my+=w;wheelD-=w*2*dt;if(Math.abs(wheelD)<.005)wheelD=0}
  yaw+=(tgtYaw-yaw)*Math.min(1,dt*10);
  const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
  if(ml>.01&&!over){const f=2*dt,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
   P.x+=(fx*my+rx*mx)*f;P.z+=(fz*my+rz*mx)*f;walkT+=dt*Math.min(1,ml)}
  /* أثناء الحمل يتسع نصف قطر اللاعب بالتدريج كي لا يخترق الغرض المحمول الأثاث */
  updateDoorObs();
  PRn+=((carry?PR+.22:PR)-PRn)*Math.min(1,dt*6);pushOut(P,PRn);
  /* الخروج بالمشي: إذا فُتح الباب ومشى اللاعب نحوه حتى وصل إلى عتبته، ينتقل إلى الغرفة التالية (إضافةً إلى النقر على الباب) */
  if(doorOpen&&!busy&&!over&&ml>.01&&Math.abs(P.x+1.6)<.55&&P.z>R-.55){
   const vz=-Math.cos(yaw)*my-Math.sin(yaw)*mx;/* مكوّن الحركة نحو جدار الباب (+z) */
   if(vz>.2){if(!carry)goNext();else if(!sayDoorT||t-sayDoorT>3){sayDoorT=t;say("ضع الغرض في مكانه أولًا، ثم اخرج من الباب")}}}
  cam.position.set(P.x,1.45+(ml>.01?Math.sin(walkT*9)*.012:0),P.z);cam.rotation.set(pitch,yaw,0);cam.updateMatrixWorld();
  if(!reaching)hand.position.lerp(carry?HCARRY:HIDLE,Math.min(1,dt*8));
  /* اليدان مخفيتان إلا عند المدّ للغرض وحمله */
  hand.visible=!!carry||reaching||hand.position.y>-.7;
  updateHands(dt,t);
  if(doorLeaf){doorO+=((doorOpen?1:0)-doorO)*Math.min(1,dt*5);doorLeaf.rotation.y=doorO*1.6;if(doorMat){doorMat.emissive.setHex(0xffc93c);doorMat.emissiveIntensity=doorOpen?.22+.18*Math.sin(t*5):0}}
  for(let i=tw.length-1;i>=0;i--){const a=tw[i];a.t+=dt;const u=Math.min(1,a.t/a.dur);a.fn(u);if(u>=1){tw.splice(i,1);a.done&&a.done()}}
  for(const it of fall){const u=it.userData;u.vy-=14*dt;it.position.y+=u.vy*dt;it.rotation.x*=.9;it.rotation.z*=.9;
   if(it.position.y<=0){it.position.y=0;if(Math.abs(u.vy)>1.2)u.vy=-u.vy*.32;else{u.vy=0;fall.delete(it)}}}
  let zMoving=false;
  for(const k in ZN){const z=ZN[k],near=!!carry&&distTo(z.g.position.x,z.g.position.z)<=ZREACH;
   const o0=z.open;z.open+=(((near||z.n>0)?1:0)-z.open)*Math.min(1,dt*7);if(z.anim)z.anim(z.open);
   if(Math.abs(z.open-o0)>.001||z.hintT>0)zMoving=true;
   if(z.parts.length)z.g.updateMatrixWorld(true);
   let ei=0,ec=0xffc93c;if(z.hintT>0){z.hintT-=dt;ec=0xff5d73;ei=.25+.3*Math.sin(t*16)}else if(near)ei=.18;
   if(ei!==z._ei||z.hintT>0){z.mats.forEach(m=>{m.emissive.setHex(ec);m.emissiveIntensity=ei});z._ei=ei}}
  let ringOn=false;
  itemsG.children.forEach(it=>{const u=it.userData;if(!u.rg)return;
   const on=!u.placed&&!carry&&it.position.y<.3&&distTo(it.position.x,it.position.z)<=REACH;u.rg.visible=on;if(on){ringOn=true;u.rg.scale.setScalar(1+.08*Math.sin(t*6))}});
  const sd=!!carry&&!busy;if(sd!==dpShown){$("dp").hidden=!sd;dpShown=sd}
  const sig=P.x.toFixed(3)+","+P.z.toFixed(3)+","+yaw.toFixed(4)+","+pitch.toFixed(4)+","+cam.position.y.toFixed(4);
  const active=needR||sig!==lastSig||tw.length>0||fall.size>0||!!carry||reaching||hand.visible||zMoving||Math.abs(doorO-(doorOpen?1:0))>.002;
  const covered=!$("res").hidden||$("fade").classList.contains("on");
  if(!covered&&(active||((ringOn||doorOpen)&&now-renderAt>80))){renderer.render(scene,cam);renderAt=now;lastSig=sig;needR=false}
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============ الأزرار ============ */
paintBest();
const paintMute=()=>{$("mt").textContent=muted?"🔇":"🔊";$("mt").setAttribute("aria-label",muted?"تشغيل الصوت":"كتم الصوت")};
$("mt").onclick=()=>{muted=!muted;try{localStorage.setItem("roomgame.mute",muted?"1":"0")}catch(e){}paintMute()};paintMute();
/* أزرار غرفة البداية: تُحفظ آخر غرفة اختارها اللاعب */
const RICON={kids:"🧸",living:"🛋️",bed:"🛏️",bath:"🛁",kitchen:"🍳"};let selL=0;
try{selL=Math.min(L.length-1,Math.max(0,+localStorage.getItem("roomgame.start")||0))}catch(e){}
const paintRooms=()=>{$("rooms").innerHTML=L.map((r,i)=>'<button class="chip'+(i===selL?" on":"")+'" role="radio" aria-checked="'+(i===selL)+'" data-i="'+i+'">'+RICON[r.id]+" "+r.name+"</button>").join("")};
$("rooms").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;selL=+b.dataset.i;try{localStorage.setItem("roomgame.start",String(selL))}catch(e){}paintRooms()};paintRooms();
$("m1").onclick=()=>start("relax",selL);
$("m2").onclick=()=>start("time",selL);
$("b2").onclick=()=>{clearInterval(timer);show("home")};
$("back").onclick=()=>{clearInterval(timer);over=true;show("home")};
$("nl").onclick=()=>turn(90);$("nr").onclick=()=>turn(-90);$("dp").onclick=()=>tryDrop(null);
addEventListener("keydown",e=>{
 if($("game").hidden||!$("res").hidden)return;
 const k=e.key.toLowerCase();
 if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){K[k]=1;e.preventDefault();return}
 if((k==="e"||k==="enter"||k===" ")&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();interact();return}
 if(k==="q"&&carry)tryDrop(null)});
addEventListener("keyup",e=>{delete K[e.key.toLowerCase()]});
addEventListener("blur",()=>{for(const k in K)delete K[k]});
</script>
